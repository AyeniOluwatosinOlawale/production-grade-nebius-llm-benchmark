apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tensorrt-qwen3-scaledobject
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tensorrt-qwen3
  minReplicaCount: 2
  maxReplicaCount: 8
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        metricName: trtllm_request_queue_size
        query: sum(nv_trt_llm_request_queue_size{namespace="llm-inference"})
        threshold: "5"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        metricName: gpu_utilisation
        query: avg(DCGM_FI_DEV_GPU_UTIL{namespace="llm-inference"})
        threshold: "70"
        activationThreshold: "50"
