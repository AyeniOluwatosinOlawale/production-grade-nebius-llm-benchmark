# kube-prometheus-stack Helm values
# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring -f monitoring/kube-prometheus-stack/values.yaml

nameOverride: kube-prometheus-stack

# Tolerations applied to every component so they can run on GPU/preemptible nodes
# (required when no dedicated CPU node group is available)
commonTolerations: &commonTolerations
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: cloud.nebius.ai/preemptible
    operator: Exists
    effect: NoSchedule

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "50GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nebius-network-ssd
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi
    tolerations: *commonTolerations
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 8Gi

grafana:
  enabled: true
  adminPassword: "nebius-llm-bench"
  tolerations: *commonTolerations
  persistence:
    enabled: true
    storageClassName: nebius-network-ssd
    size: 20Gi
  service:
    type: LoadBalancer
    port: 3000
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s"
    auth.anonymous:
      enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    tolerations: *commonTolerations
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nebius-network-ssd
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

kube-state-metrics:
  enabled: true
  tolerations: *commonTolerations

nodeExporter:
  enabled: true
  tolerations: *commonTolerations

prometheusOperator:
  tolerations: *commonTolerations
  admissionWebhooks:
    patch:
      tolerations: *commonTolerations
