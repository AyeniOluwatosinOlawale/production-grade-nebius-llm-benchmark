nameOverride: kube-prometheus-stack

prometheusOperator:
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: cloud.nebius.ai/preemptible
      operator: Exists
      effect: NoSchedule
  admissionWebhooks:
    patch:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: cloud.nebius.ai/preemptible
          operator: Exists
          effect: NoSchedule

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: "50GB"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nebius-network-ssd
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 100Gi
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.nebius.ai/preemptible
        operator: Exists
        effect: NoSchedule
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2
        memory: 8Gi

grafana:
  enabled: true
  adminPassword: "nebius-llm-bench"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: cloud.nebius.ai/preemptible
      operator: Exists
      effect: NoSchedule
  persistence:
    enabled: true
    storageClassName: nebius-network-ssd
    size: 20Gi
  service:
    type: LoadBalancer
    port: 3000
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s"
    auth.anonymous:
      enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.nebius.ai/preemptible
        operator: Exists
        effect: NoSchedule
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nebius-network-ssd
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi

kube-state-metrics:
  enabled: true
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: cloud.nebius.ai/preemptible
      operator: Exists
      effect: NoSchedule

nodeExporter:
  enabled: true
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: cloud.nebius.ai/preemptible
      operator: Exists
      effect: NoSchedule
