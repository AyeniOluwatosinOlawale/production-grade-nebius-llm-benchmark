apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llm-inference
  labels:
    app: litellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: cloud.nebius.ai/preemptible
          operator: Exists
          effect: NoSchedule
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.60.0
          ports:
            - containerPort: 4000
              name: http
          args:
            - --config=/etc/litellm/config.yaml
            - --port=4000
            - --num_workers=4
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: LITELLM_LOG
              value: "INFO"
      volumes:
        - name: config
          configMap:
            name: litellm-config
