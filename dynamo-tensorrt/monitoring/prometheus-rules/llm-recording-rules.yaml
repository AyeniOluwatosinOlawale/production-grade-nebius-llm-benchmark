apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-recording-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: llm.rules
      interval: 15s
      rules:
        - record: llm:tokens_per_second
          expr: rate(nv_trt_llm_generation_tokens_total[1m])

        - record: llm:request_throughput
          expr: rate(nv_inference_exec_count[1m])

        - record: llm:ttft_p95
          expr: histogram_quantile(0.95, rate(nv_trt_llm_first_token_latency_ms_bucket[5m])) / 1000

        - record: llm:ttft_p99
          expr: histogram_quantile(0.99, rate(nv_trt_llm_first_token_latency_ms_bucket[5m])) / 1000

        - record: llm:e2e_latency_p95
          expr: histogram_quantile(0.95, rate(nv_inference_request_duration_us_bucket[5m])) / 1000000

        - record: llm:e2e_latency_p99
          expr: histogram_quantile(0.99, rate(nv_inference_request_duration_us_bucket[5m])) / 1000000

        - record: llm:kv_cache_util
          expr: nv_trt_llm_kv_cache_utilization_ratio

        - record: trtllm:request_queue_size
          expr: nv_trt_llm_inflight_batcher_requests_waiting
