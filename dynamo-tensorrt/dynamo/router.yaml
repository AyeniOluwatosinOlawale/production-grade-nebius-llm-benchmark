apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-router
  namespace: llm-inference
  labels:
    app: dynamo-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-router
  template:
    metadata:
      labels:
        app: dynamo-router
    spec:
      containers:
        - name: dynamo-router
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.6.1
          command: ["dynamo", "serve"]
          args:
            - "--config=/etc/dynamo/pipeline.yaml"
            - "--component=Frontend"
            - "--port=8080"
            - "--host=0.0.0.0"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: pipeline-config
              mountPath: /etc/dynamo/pipeline.yaml
              subPath: pipeline.yaml
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: pipeline-config
          configMap:
            name: dynamo-pipeline-config
