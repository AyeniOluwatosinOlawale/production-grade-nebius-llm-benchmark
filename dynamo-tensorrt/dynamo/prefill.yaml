apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-tensorrt-prefill
  namespace: llm-inference
  labels:
    app: dynamo-tensorrt-prefill
    dynamo-role: prefill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-tensorrt-prefill
  template:
    metadata:
      labels:
        app: dynamo-tensorrt-prefill
        dynamo-role: prefill
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        nebius.com/gpu: "true"
      tolerations:
        - key: cloud.nebius.ai/preemptible
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: prefill-worker
          image: nvcr.io/nvidia/tritonserver:26.10-trtllm-python-py3
          command: ["trtllm-serve"]
          args:
            - "Qwen/Qwen3-27B"
            - "--tp=2"
            - "--dtype=bfloat16"
            - "--max_seq_len=32768"
            - "--port=8000"
            - "--host=0.0.0.0"
            - "--disaggregated-prefill"
            - "--kv_cache_free_gpu_mem_fraction=0.85"
          env:
            - name: DYNAMO_ROLE
              value: prefill
            - name: NATS_URL
              value: "nats://nats.llm-inference:4222"
            - name: ETCD_ENDPOINTS
              value: "etcd.llm-inference:2379"
            - name: HF_HOME
              value: /models
            - name: HUGGING_FACE_HUB_TOKEN
              value: ""
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: grpc
              containerPort: 8001
              protocol: TCP
            - name: metrics
              containerPort: 8002
              protocol: TCP
          resources:
            requests:
              nvidia.com/gpu: "2"
              memory: "160Gi"
              cpu: "8"
            limits:
              nvidia.com/gpu: "2"
              memory: "200Gi"
              cpu: "32"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: tensorrt-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
