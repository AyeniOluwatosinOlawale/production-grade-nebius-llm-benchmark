apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-prefill
  namespace: dynamo-vllm
  labels:
    app: vllm-prefill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-prefill
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vllm-prefill
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:
        - key: cloud.nebius.ai/preemptible
          operator: Exists
          effect: NoSchedule
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        nebius.com/gpu: "true"
      terminationGracePeriodSeconds: 120
      containers:
        - name: vllm-prefill
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "dynamo.vllm"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HF_HOME
              value: /models
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: NATS_URL
              value: "nats://nats.dynamo-vllm:4222"
            - name: ETCD_ENDPOINTS
              value: "etcd.dynamo-vllm:2379"
            - name: DYNAMO_NAMESPACE
              value: "dynamo-vllm"
          args:
            - --model=Qwen/Qwen3-32B
            - --tensor-parallel-size=2
            - --dtype=bfloat16
            - --max-model-len=32768
            - --gpu-memory-utilization=0.85
            - --served-model-name=qwen3-27b
            - --port=8000
            - --host=0.0.0.0
            - --max-num-seqs=64
            - --disaggregation-mode=prefill
            - --kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_producer"}
          resources:
            requests:
              nvidia.com/gpu: "2"
              memory: "160Gi"
              cpu: "8"
            limits:
              nvidia.com/gpu: "2"
              memory: "200Gi"
              cpu: "32"
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-prefill
  namespace: dynamo-vllm
  labels:
    app: vllm-prefill
spec:
  selector:
    app: vllm-prefill
  ports:
    - port: 8000
      targetPort: 8000
      name: http
