apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-router
  namespace: dynamo-vllm
  labels:
    app: dynamo-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamo-router
  template:
    metadata:
      labels:
        app: dynamo-router
    spec:
      containers:
        - name: dynamo-router
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
          command: ["python3", "-m", "dynamo.frontend"]
          args:
            - "--http-host=0.0.0.0"
            - "--http-port=8080"
            - "--namespace=dynamo-vllm"
            - "--enforce-disagg"
            - "--router-mode=round-robin"
            - "--model=qwen3-27b"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NATS_URL
              value: "nats://nats.dynamo-vllm:4222"
            - name: ETCD_ENDPOINTS
              value: "etcd.dynamo-vllm:2379"
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 4
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-router
  namespace: dynamo-vllm
  labels:
    app: dynamo-router
spec:
  selector:
    app: dynamo-router
  ports:
    - port: 8080
      targetPort: 8080
      name: http
