apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-prefill-scaledobject
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-prefill
  minReplicaCount: 2
  maxReplicaCount: 4
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        metricName: gpu_util_prefill
        query: avg(DCGM_FI_DEV_GPU_UTIL{namespace="llm-inference", pod=~"vllm-prefill-.*"})
        threshold: "70"
        activationThreshold: "50"
