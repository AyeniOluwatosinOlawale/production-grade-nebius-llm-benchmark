apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-prefill-scaledobject
  namespace: dynamo-vllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-prefill
  minReplicaCount: 1
  maxReplicaCount: 4
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        metricName: vllm_requests_waiting_prefill
        query: sum(vllm:num_requests_waiting{pod=~"vllm-prefill-.*"})
        threshold: "1"
        activationThreshold: "0"
