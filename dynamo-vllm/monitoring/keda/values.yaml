replicaCount: 2
resources:
  operator:
    limits:
      cpu: "1"
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi
  metricServer:
    limits:
      cpu: "1"
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 100Mi
prometheus:
  operator:
    enabled: true
    podMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  metricServer:
    enabled: true
    podMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
