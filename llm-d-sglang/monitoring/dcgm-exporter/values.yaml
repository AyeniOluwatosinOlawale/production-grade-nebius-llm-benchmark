# DCGM Exporter Helm values
# helm repo add gpu-helm-charts https://nvidia.github.io/dcgm-exporter/helm-charts
# helm upgrade --install dcgm-exporter gpu-helm-charts/dcgm-exporter \
#   -n monitoring -f monitoring/dcgm-exporter/values.yaml

nameOverride: dcgm-exporter

image:
  repository: nvcr.io/nvidia/k8s/dcgm-exporter
  tag: 3.3.6-3.4.2-ubuntu22.04
  pullPolicy: IfNotPresent

# Tolerate preemptible GPU nodes so DCGM runs on every GPU node
tolerations:
  - key: cloud.nebius.ai/preemptible
    operator: Exists
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

nodeSelector:
  nvidia.com/gpu.present: "true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
  interval: 15s
  honorLabels: true

# Metrics profile — collect the fields needed for LLM benchmarking
arguments:
  - -f
  - /etc/dcgm-exporter/dcp-metrics-included.csv

extraConfigMapData:
  dcp-metrics-included.csv: |
    # GPU Utilization
    DCGM_FI_DEV_GPU_UTIL,          gauge, GPU utilization (%)
    DCGM_FI_DEV_MEM_COPY_UTIL,     gauge, Memory bandwidth utilization (%)
    # VRAM
    DCGM_FI_DEV_FB_FREE,           gauge, Framebuffer memory free (MiB)
    DCGM_FI_DEV_FB_USED,           gauge, Framebuffer memory used (MiB)
    DCGM_FI_DEV_FB_TOTAL,          gauge, Framebuffer memory total (MiB)
    # NVLink
    DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, counter, Total NVLink bandwidth (MB/s)
    # Power & Thermals
    DCGM_FI_DEV_POWER_USAGE,       gauge, Power draw (W)
    DCGM_FI_DEV_GPU_TEMP,          gauge, GPU temperature (C)
    DCGM_FI_DEV_MEMORY_TEMP,       gauge, Memory temperature (C)
    # ECC errors — spot silent data corruption
    DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Single-bit ECC errors (volatile)
    DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Double-bit ECC errors (volatile)
    # PCIe
    DCGM_FI_DEV_PCIE_TX_THROUGHPUT, counter, PCIe TX throughput (MB/s)
    DCGM_FI_DEV_PCIE_RX_THROUGHPUT, counter, PCIe RX throughput (MB/s)
    # SM clocks
    DCGM_FI_DEV_SM_CLOCK,          gauge, SM clock frequency (MHz)
    DCGM_FI_DEV_MEM_CLOCK,         gauge, Memory clock frequency (MHz)
