apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-recording-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: llm.rules
      interval: 15s
      rules:
        - record: llm:tokens_per_second
          expr: sum(rate(sglang:new_seq_throughput{namespace="llm-inference"}[1m]))

        - record: llm:request_throughput
          expr: sum(rate(sglang:request_success{namespace="llm-inference"}[1m]))

        - record: llm:ttft_p50
          expr: histogram_quantile(0.50, sum(rate(sglang:time_to_first_token_seconds_bucket{namespace="llm-inference"}[5m])) by (le))

        - record: llm:ttft_p95
          expr: histogram_quantile(0.95, sum(rate(sglang:time_to_first_token_seconds_bucket{namespace="llm-inference"}[5m])) by (le))

        - record: llm:ttft_p99
          expr: histogram_quantile(0.99, sum(rate(sglang:time_to_first_token_seconds_bucket{namespace="llm-inference"}[5m])) by (le))

        - record: llm:tpot_p50
          expr: histogram_quantile(0.50, sum(rate(sglang:inter_token_latency_seconds_bucket{namespace="llm-inference"}[5m])) by (le))

        - record: llm:tpot_p95
          expr: histogram_quantile(0.95, sum(rate(sglang:inter_token_latency_seconds_bucket{namespace="llm-inference"}[5m])) by (le))

        - record: llm:e2e_latency_p95
          expr: histogram_quantile(0.95, sum(rate(sglang:e2e_request_latency_seconds_bucket{namespace="llm-inference"}[5m])) by (le))

        - record: llm:e2e_latency_p99
          expr: histogram_quantile(0.99, sum(rate(sglang:e2e_request_latency_seconds_bucket{namespace="llm-inference"}[5m])) by (le))

        - record: llm:kv_cache_util
          expr: avg(sglang:token_usage{namespace="llm-inference"})

        - record: llm:gpu_util
          expr: avg(DCGM_FI_DEV_GPU_UTIL)

        - record: llm:gpu_vram_used_gib
          expr: avg(DCGM_FI_DEV_FB_USED) / 1024

        - record: llm:requests_waiting
          expr: sum(sglang:num_requests_waiting{namespace="llm-inference"})
