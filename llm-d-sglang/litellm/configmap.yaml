apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llm-inference
data:
  config.yaml: |
    model_list:
      - model_name: qwen3-27b
        litellm_params:
          model: openai/qwen3-27b
          api_base: http://llmd-gateway.llm-inference:80/v1
          api_key: "none"
          timeout: 120
          stream_timeout: 120
          max_tokens: 2048

    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      num_workers: 4
      request_timeout: 120
      drop_params: true

    litellm_settings:
      success_callback: ["prometheus"]
      failure_callback: ["prometheus"]
      cache: false
      num_retries: 2
      retry_after: 5

    prometheus:
      success_job_metrics: true
      failure_job_metrics: true
