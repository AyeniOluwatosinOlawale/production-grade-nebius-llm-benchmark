apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sglang-qwen3-scaledobject
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sglang-qwen3
  minReplicaCount: 2
  maxReplicaCount: 8
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        metricName: sglang_requests_waiting
        query: sum(sglang:num_requests_waiting{namespace="llm-inference"})
        threshold: "5"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        metricName: gpu_utilisation
        query: avg(DCGM_FI_DEV_GPU_UTIL)
        threshold: "70"
        activationThreshold: "50"
