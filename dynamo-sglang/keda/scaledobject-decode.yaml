apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sglang-decode-scaledobject
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sglang-decode
  minReplicaCount: 2
  maxReplicaCount: 8
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        metricName: sglang_requests_waiting_decode
        query: sum(sglang:num_requests_waiting{namespace="llm-inference", pod=~"sglang-decode-.*"})
        threshold: "5"
        activationThreshold: "1"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        metricName: gpu_util_sglang_decode
        query: avg(DCGM_FI_DEV_GPU_UTIL{namespace="llm-inference", pod=~"sglang-decode-.*"})
        threshold: "70"
        activationThreshold: "50"
