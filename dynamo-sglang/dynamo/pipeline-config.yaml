apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-pipeline-config
  namespace: llm-inference
data:
  pipeline.yaml: |
    Common:
      model: Qwen/Qwen3-32B
      block_size: 16
      dtype: bfloat16
      tensor_parallel_size: 2
      max_model_len: 32768

    Frontend:
      type: openai
      host: "0.0.0.0"
      port: 8080
      num_workers: 1

    Processor:
      type: SglangWorker
      ServiceArgs:
        num_workers: 2
      max_running_requests: 64
      chunked_prefill_size: 8192
      disagg_role: prefill

    Backend:
      type: SglangWorker
      ServiceArgs:
        num_workers: 4
      max_running_requests: 256
      disagg_role: decode

    NatsConfig:
      url: "nats://nats.llm-inference:4222"

    EtcdConfig:
      endpoints:
        - "etcd.llm-inference:2379"
