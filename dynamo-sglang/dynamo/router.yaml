apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-router
  namespace: llm-inference
  labels:
    app: dynamo-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dynamo-router
  template:
    metadata:
      labels:
        app: dynamo-router
    spec:
      containers:
        - name: dynamo-router
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.6.1
          command: ["dynamo", "serve"]
          args: ["--config=/etc/dynamo/pipeline.yaml", "--component=Frontend"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NATS_URL
              value: "nats://nats.llm-inference:4222"
            - name: ETCD_ENDPOINTS
              value: "etcd.llm-inference:2379"
          volumeMounts:
            - name: pipeline-config
              mountPath: /etc/dynamo
          resources:
            requests:
              cpu: 1
              memory: 2Gi
            limits:
              cpu: 4
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
      volumes:
        - name: pipeline-config
          configMap:
            name: dynamo-pipeline-config
---
apiVersion: v1
kind: Service
metadata:
  name: dynamo-router
  namespace: llm-inference
  labels:
    app: dynamo-router
spec:
  selector:
    app: dynamo-router
  ports:
    - port: 8080
      targetPort: 8080
      name: http
